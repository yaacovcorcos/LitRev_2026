name: Release PR Second To Main

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  open-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open or refresh release PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseBranch = "main";
            const headBranch = "second";

            const compare = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: baseBranch,
              head: headBranch,
            });

            if (compare.data.ahead_by === 0) {
              core.info("second has no commits ahead of main; skipping PR creation.");
              return;
            }

            const open = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:${headBranch}`,
              base: baseBranch,
              per_page: 100,
            });

            const title = `release: promote ${headBranch} to ${baseBranch} (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              "Automated release promotion PR.",
              "",
              `- Head: \`${headBranch}\``,
              `- Base: \`${baseBranch}\``,
              `- Commits ahead: ${compare.data.ahead_by}`,
              "",
              "Run full release checks before merge and keep this PR narrowly scoped.",
            ].join("\\n");

            let pr = null;
            let created = false;

            if (open.length > 0) {
              pr = open[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
              core.info(`Updated existing release PR #${pr.number}`);
            } else {
              const result = await github.rest.pulls.create({
                owner,
                repo,
                head: headBranch,
                base: baseBranch,
                title,
                body,
                maintainer_can_modify: true,
              });
              pr = result.data;
              created = true;
              core.info(`Created release PR #${pr.number}`);
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: pr.number,
                reviewers: ["yaacovcorcos"],
              });
            } catch (error) {
              core.info(`Skipping reviewer request: ${error.message}`);
            }

            if (created) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: "@codex review",
              });
            }
