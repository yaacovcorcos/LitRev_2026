name: Auto PR To Second

on:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse pull request
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headBranch = context.ref.replace("refs/heads/", "");
            const baseBranch = "second";

            const open = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:${headBranch}`,
              base: baseBranch,
              per_page: 100,
            });

            let pr = null;
            let created = false;

            if (open.length > 0) {
              pr = open[0];
              core.info(`PR already exists: #${pr.number}`);
            } else {
              const title = `chore(agent): promote ${headBranch} into ${baseBranch}`;
              const body = [
                "Automated PR opened by workflow after branch push.",
                "",
                `- Head: \`${headBranch}\``,
                `- Base: \`${baseBranch}\``,
                "",
                "Please review CI and requested feedback before merge.",
              ].join("\\n");

              const result = await github.rest.pulls.create({
                owner,
                repo,
                head: headBranch,
                base: baseBranch,
                title,
                body,
                maintainer_can_modify: true,
              });

              pr = result.data;
              created = true;
              core.info(`Created PR #${pr.number}`);
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: pr.number,
                reviewers: ["yaacovcorcos"],
              });
            } catch (error) {
              core.info(`Skipping reviewer request: ${error.message}`);
            }

            if (created) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: "@codex review",
              });
            }
