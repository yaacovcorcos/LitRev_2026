name: Performance Certification Report

on:
  workflow_run:
    workflows: ["Performance Certification"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report failed nightly run
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          {
            echo "## Findings"
            echo "- \`Performance Certification\` run \`${{ github.event.workflow_run.id }}\` on branch \`${{ github.event.workflow_run.head_branch }}\` finished with conclusion \`${{ github.event.workflow_run.conclusion }}\`."
            echo "- No performance artifact metrics were analyzed because the source workflow did not succeed."
            echo
            echo "## Implications"
            echo "- Nightly trend continuity is interrupted until a successful run uploads an artifact."
            echo
            echo "## Recommended Next Actions"
            echo "1. Open the failed nightly run and inspect the first failing step."
            echo "2. Re-run the workflow after fixing the failure source."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download current nightly artifact
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: performance-nightly-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: .artifacts/current
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve previous successful nightly run
        id: prev
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = context.payload.workflow_run.workflow_id;
            const branch = context.payload.workflow_run.head_branch;
            const currentId = context.payload.workflow_run.id;

            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              branch,
              per_page: 25,
            });

            const previous = response.data.workflow_runs.find((run) => {
              return run.id !== currentId && run.conclusion === "success";
            });

            if (!previous) {
              core.info("No previous successful run found.");
              return;
            }

            core.setOutput("run_id", String(previous.id));
            core.setOutput("run_attempt", String(previous.run_attempt));
            core.info(`Previous successful run: ${previous.id} (attempt ${previous.run_attempt})`);

      - name: Download previous nightly artifact
        if: ${{ github.event.workflow_run.conclusion == 'success' && steps.prev.outputs.run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.prev.outputs.run_id }}
          name: performance-nightly-${{ steps.prev.outputs.run_id }}-${{ steps.prev.outputs.run_attempt }}
          path: .artifacts/previous
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate nightly report summary
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        env:
          NIGHTLY_RUN_ID: ${{ github.event.workflow_run.id }}
          NIGHTLY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          NIGHTLY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          NIGHTLY_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          NIGHTLY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIOUS_RUN_ID: ${{ steps.prev.outputs.run_id }}
          PREVIOUS_RUN_ATTEMPT: ${{ steps.prev.outputs.run_attempt }}
          CURRENT_ARTIFACT_DIR: .artifacts/current
          PREVIOUS_ARTIFACT_DIR: .artifacts/previous
          BUDGET_PATH: output/performance/baseline/budget-thresholds.json
        run: node .github/scripts/perf-nightly-report.mjs >> "$GITHUB_STEP_SUMMARY"
