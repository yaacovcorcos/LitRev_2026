name: CI
on:
  push:
    branches: [main, "YY/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: litrev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/litrev_test
      DIRECT_URL: postgresql://test:test@localhost:5432/litrev_test
      SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/litrev_shadow
      BETTER_AUTH_SECRET: ci-perf-probe-secret-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_APP_VERSION: ci-perf-probe
      NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      PERF_BUDGET_MODE: enforce

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: cd next-app && npm ci

      - name: Apply migrations
        run: cd next-app && npx prisma migrate deploy

      - name: Prepare shadow database
        run: |
          psql "postgresql://test:test@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS litrev_shadow;'
          psql "postgresql://test:test@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE litrev_shadow;'
          psql "postgresql://test:test@localhost:5432/litrev_shadow" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Check for schema drift
        run: |
          set +e
          DRIFT_OUTPUT="$(
            cd next-app && npx prisma migrate diff \
              --from-migrations prisma/migrations \
              --to-schema prisma/schema.prisma \
              --exit-code 2>&1
          )"
          DRIFT_STATUS=$?
          set -e

          printf '%s\n' "$DRIFT_OUTPUT"

          # Exit 0 means no drift.
          if [ "$DRIFT_STATUS" -eq 0 ]; then
            exit 0
          fi

          # Exit 2 means drift was detected. Allow only the known pgvector index drift
          # that Prisma schema cannot currently model for the MemoryEmbedding vector index.
          if [ "$DRIFT_STATUS" -eq 2 ]; then
            CLEAN_OUTPUT="$(printf '%s\n' "$DRIFT_OUTPUT" | sed -E 's/\x1B\[[0-9;]*[mK]//g')"

            if printf '%s\n' "$CLEAN_OUTPUT" | grep -Fq '[*] Changed the `MemoryEmbedding` table' \
              && printf '%s\n' "$CLEAN_OUTPUT" | grep -Fq '[-] Removed index on columns (embedding)'; then
              EXTRA_DRIFT="$(printf '%s\n' "$CLEAN_OUTPUT" \
                | sed -E 's/^[[:space:]]+//' \
                | grep -E '^\[\*\] Changed the `|^\[\+\] Added|^\[-\] Removed' \
                | grep -Ev '^\[\*\] Changed the `MemoryEmbedding` table$|^\[-\] Removed index on columns \(embedding\)$' || true)"

              if [ -z "$EXTRA_DRIFT" ]; then
                echo "Allowed known pgvector index drift (MemoryEmbedding embedding index)."
                exit 0
              fi
            fi
          fi

          exit "$DRIFT_STATUS"

      - name: Type check
        run: cd next-app && npx tsc --noEmit

      - name: Chat stream architecture guard
        run: cd next-app && node scripts/check-chat-stream-architecture.mjs --mode=${CHAT_STREAM_ARCH_GUARD_MODE:-enforce}

      - name: Run tests
        run: cd next-app && npx vitest run
        env:
          RUN_DB_TESTS: "1"

      - name: Install Playwright browser
        run: cd next-app && npx playwright install --with-deps chromium

      - name: Run mobile foundation certification
        run: cd next-app && npm run test:e2e:mobile:foundation

      - name: Build production app for performance probe
        run: cd next-app && npx next build
        env:
          NEXT_PUBLIC_ENABLE_PERFORMANCE_TELEMETRY: "0"

      - name: Generate performance results artifact
        run: |
          cd next-app
          mkdir -p ../tmp
          npx next start --hostname 127.0.0.1 --port 3201 > ../tmp/perf-probe-server.log 2>&1 &
          PERF_SERVER_PID=$!

          cleanup() {
            kill "$PERF_SERVER_PID" >/dev/null 2>&1 || true
            wait "$PERF_SERVER_PID" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3201/login >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3201/login >/dev/null

          npm run perf:generate-results -- \
            --base-url "http://127.0.0.1:3201" \
            --budget "../output/performance/baseline/budget-thresholds.json" \
            --output "../output/performance/results/results-${GITHUB_SHA}.json" \
            --commit "${GITHUB_SHA}" \
            --runs 9
        env:
          NEXT_PUBLIC_ENABLE_PERFORMANCE_TELEMETRY: "0"

      - name: Assert performance artifacts exist
        run: |
          test -f output/performance/baseline/budget-thresholds.json || (echo "::error::missing performance budget artifact" && exit 1)
          test -f output/performance/baseline/baseline-latest.json || (echo "::error::missing performance baseline artifact" && exit 1)
          test -f output/performance/baseline/waivers.json || (echo "::error::missing performance waivers artifact" && exit 1)
          test -f output/performance/results/results-${GITHUB_SHA}.json || (echo "::error::missing performance results artifact" && exit 1)

      - name: Upload performance results artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ github.sha }}
          path: output/performance/results/results-${{ github.sha }}.json
          if-no-files-found: error

      - name: Performance budget gate
        run: |
          cd next-app
          npm run perf:budget-check -- \
            --mode="${PERF_BUDGET_MODE}" \
            --budget="../output/performance/baseline/budget-thresholds.json" \
            --baseline="../output/performance/baseline/baseline-latest.json" \
            --results="../output/performance/results/results-${GITHUB_SHA}.json" \
            --waivers="../output/performance/baseline/waivers.json"
