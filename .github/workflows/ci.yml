name: CI
on:
  push:
    branches: [main, "YY/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: litrev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/litrev_test
      DIRECT_URL: postgresql://test:test@localhost:5432/litrev_test
      SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/litrev_shadow
      BETTER_AUTH_SECRET: ci-perf-probe-secret-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_APP_VERSION: ci-perf-probe
      NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      PERF_BUDGET_MODE: enforce

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: cd next-app && npm ci

      - name: Apply migrations
        run: cd next-app && npx prisma migrate deploy

      - name: Prepare shadow database
        run: |
          psql "postgresql://test:test@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS litrev_shadow;'
          psql "postgresql://test:test@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE litrev_shadow;'
          psql "postgresql://test:test@localhost:5432/litrev_shadow" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Check for schema drift
        run: |
          set +e
          DRIFT_OUTPUT="$(
            cd next-app && npx prisma migrate diff \
              --from-migrations prisma/migrations \
              --to-schema prisma/schema.prisma \
              --exit-code 2>&1
          )"
          DRIFT_STATUS=$?
          set -e

          printf '%s\n' "$DRIFT_OUTPUT"

          # Exit 0 means no drift.
          if [ "$DRIFT_STATUS" -eq 0 ]; then
            exit 0
          fi

          # Exit 2 means drift was detected. Allow only the known pgvector index drift
          # that Prisma schema cannot currently model for the MemoryEmbedding vector index.
          if [ "$DRIFT_STATUS" -eq 2 ]; then
            CLEAN_OUTPUT="$(printf '%s\n' "$DRIFT_OUTPUT" | sed -E 's/\x1B\[[0-9;]*[mK]//g')"

            if printf '%s\n' "$CLEAN_OUTPUT" | grep -Fq '[*] Changed the `MemoryEmbedding` table' \
              && printf '%s\n' "$CLEAN_OUTPUT" | grep -Fq '[-] Removed index on columns (embedding)'; then
              EXTRA_DRIFT="$(printf '%s\n' "$CLEAN_OUTPUT" \
                | sed -E 's/^[[:space:]]+//' \
                | grep -E '^\[\*\] Changed the `|^\[\+\] Added|^\[-\] Removed' \
                | grep -Ev '^\[\*\] Changed the `MemoryEmbedding` table$|^\[-\] Removed index on columns \(embedding\)$' || true)"

              if [ -z "$EXTRA_DRIFT" ]; then
                echo "Allowed known pgvector index drift (MemoryEmbedding embedding index)."
                exit 0
              fi
            fi
          fi

          exit "$DRIFT_STATUS"

      - name: Type check
        run: cd next-app && npx tsc --noEmit

      - name: Governance required gate
        run: cd next-app && npm run governance:ci-required

      - name: Governance informational reporting
        if: always()
        continue-on-error: true
        run: cd next-app && npm run governance:ci-informational

      - name: Upload governance audit baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-audit
          path: next-app/governance-audit.json

      - name: Chat stream architecture guard
        run: cd next-app && node scripts/check-chat-stream-architecture.mjs --mode=${CHAT_STREAM_ARCH_GUARD_MODE:-enforce}

      - name: Agent quality gate
        run: cd next-app && npm run check:agent-quality -- --json

      - name: Run tests
        run: cd next-app && npx vitest run
        env:
          RUN_DB_TESTS: "1"

      - name: Build production app
        run: cd next-app && npx next build
        env:
          NEXT_PUBLIC_ENABLE_PERFORMANCE_TELEMETRY: "0"
