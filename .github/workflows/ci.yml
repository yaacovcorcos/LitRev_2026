name: CI
on:
  push:
    branches: [main, second]
  pull_request:
    branches: [main, second]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: litrev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/litrev_test
      DIRECT_URL: postgresql://test:test@localhost:5432/litrev_test
      SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/litrev_shadow

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: cd next-app && npm ci

      - name: Prepare shadow database
        run: |
          PGPASSWORD=test psql -h localhost -U test -d postgres -c 'DROP DATABASE IF EXISTS litrev_shadow;'
          PGPASSWORD=test psql -h localhost -U test -d postgres -c 'CREATE DATABASE litrev_shadow;'

      - name: Apply migrations
        run: cd next-app && npx prisma migrate deploy

      - name: Check for schema drift
        run: |
          set +e
          cd next-app && npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
          status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error::Prisma migrate diff command failed."
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            echo "::warning::Schema drift detected between migrations and schema. Treat as release-blocking debt."
          fi
          exit 0

      - name: Type check
        run: cd next-app && npx tsc --noEmit

      - name: Run tests
        run: cd next-app && npx vitest run
        env:
          RUN_DB_TESTS: "1"
