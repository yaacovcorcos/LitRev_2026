name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: litrev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/litrev_test
      DIRECT_URL: postgresql://test:test@localhost:5432/litrev_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: cd next-app && npm ci

      - name: Apply migrations
        run: cd next-app && npx prisma migrate deploy

      - name: Check for schema drift
        run: |
          cd next-app && npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Type check
        run: cd next-app && npx tsc --noEmit

      - name: Chat stream architecture guard (warn mode)
        run: cd next-app && node scripts/check-chat-stream-architecture.mjs --mode=${CHAT_STREAM_ARCH_GUARD_MODE:-warn}

      - name: Run tests
        run: cd next-app && npx vitest run
        env:
          RUN_DB_TESTS: "1"
