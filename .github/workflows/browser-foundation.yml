name: Browser Foundation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "next-app/app/**"
      - "next-app/components/**"
      - "next-app/styles/**"
      - "next-app/e2e/**"
      - "next-app/playwright.config.ts"
      - "next-app/package.json"
      - "next-app/package-lock.json"
      - "next-app/lib/mobile/**"
      - "next-app/lib/ai/**"
      - "next-app/lib/artifacts/**"
      - "next-app/lib/project-data-events.ts"
      - "next-app/lib/project-conversation*.ts"
      - "next-app/lib/server/agent/**"
      - "next-app/lib/server/ai/**"
      - "next-app/contexts/**"
      - "next-app/hooks/**"
      - "next-app/types/**"
      - "next-app/prisma/**"
      - "next-app/app/PerformanceVitalsReporter.tsx"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-foundation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: litrev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/litrev_test
      DIRECT_URL: postgresql://test:test@localhost:5432/litrev_test
      SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/litrev_shadow
      BETTER_AUTH_SECRET: ci-mobile-smoke-secret-0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: cd next-app && npm ci

      - name: Apply migrations
        run: cd next-app && npx prisma migrate deploy

      - name: Install Playwright browser
        run: cd next-app && npx playwright install --with-deps chromium

      - name: Run browser foundation e2e
        run: cd next-app && npm run test:e2e:foundation

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-foundation-playwright-report
          path: next-app/playwright-report
          if-no-files-found: ignore
