name: Auto Request Codex Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  request-codex-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Comment @codex review once per head commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const marker = `<!-- codex-auto-review:${headSha} -->`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            if (comments.some((c) => typeof c.body === "string" && c.body.includes(marker))) {
              core.info(`Codex review already requested for ${headSha}.`);
              return;
            }

            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `@codex review\n${marker}`,
              });
              core.info(`Requested Codex review for ${headSha}.`);
            } catch (error) {
              // Fork-originated PRs may not grant write permissions to GITHUB_TOKEN.
              core.warning(`Could not request Codex review: ${error.message}`);
            }
